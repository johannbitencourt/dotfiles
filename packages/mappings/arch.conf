# Arch (pacman) capability -> package mapping.
# TSV: capability<TAB>package<TAB>note
# Every row here resolves to "native" in Phase 1 — every capability below is
# confirmed present in Arch's official extra/core repos, so no community/AUR
# consent path is exercised yet.

hyprland	hyprland
waybar	waybar
fuzzel	fuzzel
mako	mako
hyprlock	hyprlock
hypridle	hypridle
swaybg	swaybg
wl-clipboard	wl-clipboard
foot	foot
bash	bash
jq	jq
git	git
curl-or-wget	curl
pipewire	pipewire
wireplumber	wireplumber
networkmanager	networkmanager
polkit-agent	hyprpolkitagent	Hyprland-native polkit agent
xdg-desktop-portal	xdg-desktop-portal
xdg-desktop-portal-hyprland	xdg-desktop-portal-hyprland
toolkit-portal	xdg-desktop-portal-gtk	default toolkit portal backend
fonts-core	ttf-jetbrains-mono-nerd	covers terminal + waybar/fuzzel glyphs
icons-core	adwaita-icon-theme	minimal, no extra theme dependency
diagnostics-core	pciutils	provides lspci for GPU detection
