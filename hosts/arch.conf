# Host profile for this machine (hostname: arch, Dell G15 5515).
# Parsed by kv_parse_file — strict KEY=VALUE, never sourced.
#
# Dock-dependent or otherwise runtime-variable values (external monitor mode,
# hybrid GPU offload vars, etc.) do NOT belong here — put them in
# ~/.config/dotfiles/hosts/arch.local.conf instead, which overrides this file
# and is never committed to the repo.

HOST_TYPE=laptop
GPU_VENDOR=nvidia
GPU_MODE=single
SESSION_MODE=tty
PRIMARY_OUTPUT=eDP-1
INTERNAL_OUTPUT=eDP-1
INTERNAL_ENABLED=1
KEYBOARD_LAYOUT=us
