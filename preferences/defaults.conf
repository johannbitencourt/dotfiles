# Project-wide app-tuning defaults. Parsed by kv_parse_file — strict
# KEY=VALUE, never sourced. Lowest-priority layer: overridden by the host
# profile, then a local host override, then --preference CLI flags (see
# plan::resolve_host in install/plan.sh).
#
# Base Hyprland config is deliberately performance-oriented per HLD's
# low-overhead policy: animations and blur are off by default.

HYPR_GAPS_IN=4
HYPR_GAPS_OUT=8
HYPR_BORDER_SIZE=2
HYPR_ANIMATIONS=0
HYPR_BLUR=0

TERMINAL_FONT=JetBrainsMono Nerd Font
TERMINAL_FONT_SIZE=12
TERMINAL_PADDING=8

WALLPAPER_COLOR=1a1b26

# Suspend is deliberately not configured in Phase 1: hypridle has no native
# way to vary a timeout by power state (AC vs. battery) without an extra
# wrapper script, so a single conservative lock/screen-off pair is used
# regardless of power source, and auto-suspend is left off entirely (matches
# the HLD's "suspend disabled by default" desktop policy, extended here to
# the laptop for now). Revisit if battery-only auto-suspend is actually wanted.
LOCK_TIMEOUT_SEC=300
SCREENOFF_TIMEOUT_SEC=360
