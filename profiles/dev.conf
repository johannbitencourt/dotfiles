# Development tooling profile (HLD section 9.8 worked example).
# Parsed by kv_parse_file — strict KEY=VALUE, never sourced. List-valued
# fields are comma-joined single values (kv_parse_file has no list
# support — see scripts/lib/kv-parser.sh); split in caller code, not here.
# Comma-free values only, same constraint every existing preference value
# already meets.
#
# Deliberately absent fields (see install/profile.sh's header for why):
# DEFAULT_PROVIDERS (the provider abstraction doesn't exist yet),
# POST_INSTALL_VALIDATIONS (folded into 'dotctl doctor', not a per-profile
# DSL), REMOVAL_IMPACT_POLICY (one fixed orphan-check algorithm — a policy
# enum with one real value is a switch with one case).

PROFILE_ID=dev
PROFILE_DESCRIPTION=Command-line development tooling: editor, multiplexer, git UI, file manager, runtime/container managers, search/nav tools.
# jq is deliberately the EXISTING core "jq" capability
# (packages/capabilities.conf), not a new "json-tool-jq" — see
# install/profile.sh's header for the naming rationale.
REQUIRED_CAPABILITIES=neovim,tmux,lazygit,yazi,mise,docker,ripgrep,fd,fzf,zoxide,jq
OPTIONAL_CAPABILITIES=
PREFERENCE_DEFAULTS=EDITOR=nvim
RECOMMENDED_PROFILES=
CONFLICTING_PROFILES=
HARDWARE_CONSTRAINTS=
