# Trivial zero-capability profile (HLD section 9.8's profiles/ tree includes
# core.conf). Exists only to exercise the empty-required-capabilities path
# cheaply — dev.conf, with 11 capabilities, never exercises that edge.
#
# This is NOT the source of truth for "core, always-retained" packages —
# that's still packages/capabilities.conf + mappings/arch.conf, read
# directly by install.sh, independent of this file or whether
# 'dotctl profile install core' has ever been run.

PROFILE_ID=core
PROFILE_DESCRIPTION=Baseline desktop capabilities already installed by install.sh; nothing additional to install here.
REQUIRED_CAPABILITIES=
OPTIONAL_CAPABILITIES=
PREFERENCE_DEFAULTS=
RECOMMENDED_PROFILES=
CONFLICTING_PROFILES=
HARDWARE_CONSTRAINTS=
