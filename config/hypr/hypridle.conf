# Screen off at 6 min, lock at 5 min. Auto-suspend is deliberately not
# configured: hypridle can't vary a timeout by power state (AC vs battery)
# without a wrapper script, and a laptop that suspends on AC is worse than one
# that doesn't suspend at all.

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
}

listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

listener {
    timeout = 360
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}
