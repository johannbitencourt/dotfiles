# Compatibility data for the Phase-1 (Arch-only) adapter.
# Parsed by kv_parse_file — strict KEY=VALUE, never sourced.
#
# HYPRLAND_MIN_VERSION=0.56.0: the generated config uses syntax that isn't
# universally backwards-compatible (e.g. decoration.shadow.enabled, not the
# older drop_shadow key) — 0.56.0 is the version this project is actually
# built and verified against (real `Hyprland --verify-config` runs this
# session), not an unverified guess at an older floor.

DISTRO_ID=arch
HYPRLAND_MIN_VERSION=0.56.0
